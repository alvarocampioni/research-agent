[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Comparação entre um agente de pesquisa não interativo e um iterativo (LangGraph), com harness e evals."
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
